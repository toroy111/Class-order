<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAF 記錄表</title>
    <style>
        :root {
            --grid-color: #d1d5db;
            --header-bg: #f3f4f6;
            --hover-bg: #f9fafb;
            --text-color: #374151;
            --primary-btn: #4b5563;
            --danger-btn: #ef4444;
            --selected-bg: #eff6ff;
            --selected-border: #3b82f6;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-color);
        }

        body {
            background-color: #f8fafc;
            padding: 20px 12px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 🔒 登入對話框樣式 (響應式) */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
        }

        .login-card {
            background: #ffffff;
            padding: 24px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-card h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--grid-color);
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            -webkit-appearance: none;
        }

        .login-card input[type="password"]:focus {
            border-color: var(--selected-border);
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-btn);
            font-size: 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .error-msg {
            color: var(--danger-btn);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* 📊 主容器 (自動適應電腦與手機寬度) */
        .container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: none; /* 預設隱藏，登入後顯示 */
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        h2 {
            margin: 0;
            font-weight: 600;
            color: #111827;
            letter-spacing: 0.5px;
            font-size: 20px;
        }

        /* 🔘 工具列按鈕樣式 (手機版自動換行優化) */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        button {
            background-color: var(--primary-btn);
            color: #ffffff;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        button.danger {
            background-color: var(--danger-btn);
        }

        /* 🏁 樸素方格表格樣式 (適應手機滑動) */
        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* iOS 滑動順暢 */
            border: 1px solid var(--grid-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            text-align: left;
            min-width: 500px; /* 確保手機上有合理的最小寬度 */
        }

        th, td {
            border: 1px solid var(--grid-color);
            padding: 10px 12px;
            min-width: 100px;
            font-size: 14px;
            position: relative;
            word-break: break-word;
        }

        th {
            background-color: var(--header-bg);
            font-weight: 600;
        }

        /* 當前點選/選取的儲存格高亮 */
        th.selected-cell, td.selected-cell {
            outline: 2px solid var(--selected-border) !important;
            outline-offset: -2px;
            background-color: var(--selected-bg) !important;
        }

        /* 儲存格編輯狀態 */
        td[contenteditable="true"]:focus, th[contenteditable="true"]:focus {
            outline: 2px solid var(--selected-border);
            background-color: #ffffff;
        }

        tr:hover td {
            background-color: var(--hover-bg);
        }

        /* 📱 手機版專屬微調 (螢幕寬度 < 600px 時套用) */
        @media (max-width: 600px) {
            body {
                padding: 10px 8px;
            }

            .container {
                padding: 14px 10px;
                border-radius: 8px;
            }

            h2 {
                font-size: 16px;
            }

            .header-row button {
                padding: 6px 10px;
                font-size: 12px;
            }

            .toolbar {
                gap: 6px;
            }

            .toolbar button {
                flex: 1 1 calc(50% - 6px); /* 手機上按鈕兩兩一排 */
                padding: 8px 6px;
                font-size: 12px;
            }

            .toolbar button.danger {
                flex: 1 1 100%; /* 清空按鈕單獨佔據整列 */
                margin-left: 0 !important;
                margin-top: 4px;
            }

            th, td {
                padding: 8px 10px;
                font-size: 13px;
                min-width: 90px;
            }
        }
    </style>
</head>
<body>

<!-- 🔒 登入視窗 -->
<div class="login-overlay" id="loginModal">
    <div class="login-card">
        <h3>請輸入密碼登入</h3>
        <input type="password" id="passwordInput" placeholder="請輸入密碼 (預設 admin)" onkeydown="if(event.key==='Enter') submitLogin()">
        <button onclick="submitLogin()">登入</button>
        <div class="error-msg" id="errorMsg">密碼錯誤，請重新輸入！</div>
    </div>
</div>

<!-- 📊 主系統介面 -->
<div class="container" id="mainContainer">
    <div class="header-row">
        <h2>JAF 記錄表 (雲端同步版)</h2>
        <!-- 登出按鈕 -->
        <button class="danger" onclick="logout()">登出</button>
    </div>

    <!-- 操作按鈕列 -->
    <div class="toolbar">
        <button onmousedown="event.preventDefault()" onclick="addRowBelowSelected()">+ 下方新增列</button>
        <button onmousedown="event.preventDefault()" onclick="removeSelectedRow()">- 刪除此橫列</button>
        <button onmousedown="event.preventDefault()" onclick="addColumnRightSelected()">+ 右側新增欄</button>
        <button onmousedown="event.preventDefault()" onclick="removeSelectedColumn()">- 刪除此直欄</button>
        <button class="danger" onclick="clearData()" style="margin-left: auto;">清空重設</button>
    </div>

    <!-- 表格區域 -->
    <div class="table-container">
        <table id="gridTable">
            <thead>
                <tr id="tableHeader">
                    <th contenteditable="true">欄位 1</th>
                    <th contenteditable="true">欄位 2</th>
                    <th contenteditable="true">欄位 3</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td contenteditable="true">內容 A1</td>
                    <td contenteditable="true">內容 B1</td>
                    <td contenteditable="true">內容 C1</td>
                </tr>
                <tr>
                    <td contenteditable="true">內容 A2</td>
                    <td contenteditable="true">內容 B2</td>
                    <td contenteditable="true">內容 C2</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 引入 Firebase SDK (Compat 相容版本) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    // Firebase 專案設定
    const firebaseConfig = {
        apiKey: "AIzaSyAgeP2a6Z-TqJaZ5F0j_2UoXVQ_WE3sckw",
        authDomain: "jaffff-34d02.firebaseapp.com",
        databaseURL: "https://jaffff-34d02-default-rtdb.firebaseio.com",
        projectId: "jaffff-34d02",
        storageBucket: "jaffff-34d02.firebasestorage.app",
        messagingSenderId: "332430248808",
        appId: "1:332430248808:web:7d73ad95381dd1f3e664dd",
        measurementId: "G-LQYZZV98HC"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref('tableData');

    const table = document.getElementById("gridTable");
    const tableHeader = document.getElementById("tableHeader");
    const tableBody = document.getElementById("tableBody");
    const mainContainer = document.getElementById("mainContainer");
    const loginModal = document.getElementById("loginModal");
    const passwordInput = document.getElementById("passwordInput");
    const errorMsg = document.getElementById("errorMsg");

    const ADMIN_PASSWORD = "admin"; // 👈 登入密碼
    let selectedCell = null;
    let isUpdatingFromCloud = false;
    let isComposing = false; // 紀錄是否正在打注音中

    // 預設初始表格資料
    const defaultData = {
        headers: ["欄位 1", "欄位 2", "欄位 3"],
        rows: [
            ["內容 A1", "內容 B1", "內容 C1"],
            ["內容 A2", "內容 B2", "內容 C2"]
        ]
    };

    // 網頁開啟時檢查登入狀態
    document.addEventListener("DOMContentLoaded", function() {
        const isAuth = sessionStorage.getItem("isAdminAuth");
        if (isAuth === "true") {
            showApp();
        } else {
            loginModal.style.display = "flex";
            passwordInput.focus();
        }
    });

    // 🔑 登入驗證
    function submitLogin() {
        const inputVal = passwordInput.value;
        if (inputVal === ADMIN_PASSWORD) {
            sessionStorage.setItem("isAdminAuth", "true");
            errorMsg.style.display = "none";
            showApp();
        } else {
            errorMsg.style.display = "block";
            passwordInput.value = "";
            passwordInput.focus();
        }
    }

    // 🚪 登出功能
    function logout() {
        if (confirm("確定要登出系統嗎？")) {
            sessionStorage.removeItem("isAdminAuth");
            location.reload();
        }
    }

    // 顯示主介面並監聽 Firebase 資料
    function showApp() {
        loginModal.style.display = "none";
        mainContainer.style.display = "block";

        // 監聽 Firebase 雲端資料變動 (即時同步)
        dbRef.on('value', function(snapshot) {
            const data = snapshot.val();
            if (data) {
                // 如果使用者正在編輯輸入中，先不強制刷掉畫面，避免打字被切斷
                if (document.activeElement && document.activeElement.isContentEditable) {
                    return;
                }
                isUpdatingFromCloud = true;
                renderTableData(data);
                bindCellEvents();
                isUpdatingFromCloud = false;
            } else {
                dbRef.set(defaultData);
            }
        });

        // 解決注音斷字問題：監聽輸入法狀態
        table.addEventListener("compositionstart", function() {
            isComposing = true;
        });

        table.addEventListener("compositionend", function() {
            isComposing = false;
            saveTableDataToCloud();
        });

        // 監聽本地輸入事件，只有在「非注音拼字狀態」下才同步
        table.addEventListener("input", function() {
            if (!isUpdatingFromCloud && !isComposing) {
                saveTableDataToCloud();
            }
        });
    }

    // 綁定儲存格點選事件
    function bindCellEvents() {
        table.querySelectorAll("th, td").forEach(function(cell) {
            cell.removeEventListener("focus", handleCellFocus);
            cell.removeEventListener("mousedown", handleCellFocus);
            cell.removeEventListener("blur", saveTableDataToCloud);
            
            cell.addEventListener("focus", handleCellFocus);
            cell.addEventListener("mousedown", handleCellFocus);
            cell.addEventListener("blur", saveTableDataToCloud);
        });
    }

    function handleCellFocus(e) {
        if (selectedCell) {
            selectedCell.classList.remove("selected-cell");
        }
        selectedCell = e.currentTarget;
        selectedCell.classList.add("selected-cell");
    }

    function getSelectedPosition() {
        if (!selectedCell) return null;
        const cell = selectedCell;
        const colIndex = cell.cellIndex;
        const row = cell.parentElement;
        return { row, cell, colIndex };
    }

    // ➕ 下方新增橫列
    function addRowBelowSelected() {
        const pos = getSelectedPosition();
        const colCount = tableHeader.cells.length;
        const newRow = document.createElement("tr");

        for (let i = 0; i < colCount; i++) {
            const newCell = document.createElement("td");
            newCell.contentEditable = "true";
            newCell.textContent = "";
            newRow.appendChild(newCell);
        }

        if (pos && pos.row.parentElement.tagName === "TBODY") {
            pos.row.after(newRow);
        } else {
            tableBody.appendChild(newRow);
        }

        bindCellEvents();
        saveTableDataToCloud();
    }

    // ➖ 刪除橫列
    function removeSelectedRow() {
        const pos = getSelectedPosition();

        if (!pos) {
            if (tableBody.rows.length > 1) {
                tableBody.deleteRow(-1);
                saveTableDataToCloud();
            } else {
                alert("至少需保留一列資料！");
            }
            return;
        }

        if (pos.row.parentElement.tagName === "THEAD") {
            alert("不能刪除標題表頭列！");
            return;
        }

        if (tableBody.rows.length <= 1) {
            alert("至少需保留一列資料！");
            return;
        }

        pos.row.remove();
        selectedCell = null;
        bindCellEvents();
        saveTableDataToCloud();
    }

    // ➕ 右側新增直欄
    function addColumnRightSelected() {
        const pos = getSelectedPosition();
        const colIndex = pos ? pos.colIndex : tableHeader.cells.length - 1;

        const ths = Array.from(tableHeader.cells);
        const newTh = document.createElement("th");
        newTh.contentEditable = "true";
        newTh.textContent = "欄位 " + (ths.length + 1);
        ths[colIndex].after(newTh);

        Array.from(tableBody.rows).forEach(function(row) {
            const tds = Array.from(row.cells);
            const newTd = document.createElement("td");
            newTd.contentEditable = "true";
            newTd.textContent = "";
            if (tds[colIndex]) {
                tds[colIndex].after(newTd);
            } else {
                row.appendChild(newTd);
            }
        });

        bindCellEvents();
        saveTableDataToCloud();
    }

    // ➖ 刪除直欄
    function removeSelectedColumn() {
        if (tableHeader.cells.length <= 1) {
            alert("至少需保留一欄！");
            return;
        }

        const pos = getSelectedPosition();
        const targetColIndex = pos ? pos.colIndex : tableHeader.cells.length - 1;

        tableHeader.deleteCell(targetColIndex);

        Array.from(tableBody.rows).forEach(function(row) {
            if (row.cells[targetColIndex]) {
                row.deleteCell(targetColIndex);
            }
        });

        selectedCell = null;
        bindCellEvents();
        saveTableDataToCloud();
    }

    // 💾 儲存至雲端
    function saveTableDataToCloud() {
        const headers = Array.from(tableHeader.cells).map(function(cell) { return cell.textContent; });
        const rows = Array.from(tableBody.rows).map(function(row) { 
            return Array.from(row.cells).map(function(cell) { return cell.textContent; });
        });

        const tableData = { headers: headers, rows: rows };
        dbRef.set(tableData);
    }

    // 🖥 渲染雲端資料到表格
    function renderTableData(data) {
        if (!data || !data.headers || !data.rows) return;

        const headers = data.headers;
        const rows = data.rows;

        tableHeader.innerHTML = "";
        headers.forEach(function(text) {
            const th = document.createElement("th");
            th.contentEditable = "true";
            th.textContent = text;
            tableHeader.appendChild(th);
        });

        tableBody.innerHTML = "";
        rows.forEach(function(rowData) {
            const tr = document.createElement("tr");
            rowData.forEach(function(text) {
                const td = document.createElement("td");
                td.contentEditable = "true";
                td.textContent = text;
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });
    }

    // 🧹 清空重設
    function clearData() {
        if (confirm("確定要清空並重設雲端表格嗎？")) {
            dbRef.set(defaultData);
        }
    }
</script>

</body>
</html>
