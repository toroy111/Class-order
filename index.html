<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAF 記錄表</title>
    <style>
        :root {
            --grid-color: #d1d5db;
            --header-bg: #f3f4f6;
            --hover-bg: #f9fafb;
            --text-color: #374151;
            --primary-btn: #4b5563;
            --success-btn: #059669;
            --danger-btn: #ef4444;
            --selected-bg: #eff6ff;
            --selected-border: #3b82f6;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-color);
        }

        body {
            background-color: #f8fafc;
            padding: 20px 12px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 🔒 登入對話框樣式 */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
        }

        .login-card {
            background: #ffffff;
            padding: 24px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-card h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--grid-color);
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            -webkit-appearance: none;
        }

        .login-card input[type="password"]:focus {
            border-color: var(--selected-border);
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-btn);
            font-size: 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .error-msg {
            color: var(--danger-btn);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* 📊 主容器 */
        .container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: none;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        h2 {
            margin: 0;
            font-weight: 600;
            color: #111827;
            letter-spacing: 0.5px;
            font-size: 20px;
        }

        /* 🔘 表格結構按鈕列 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            background-color: var(--primary-btn);
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        button.success {
            background-color: var(--success-btn);
        }

        button.danger {
            background-color: var(--danger-btn);
        }

        /* 📝 Word 風格文字編輯工具列 */
        .text-editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background-color: #f3f4f6;
            border: 1px solid var(--grid-color);
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .editor-btn {
            background-color: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 4px;
            min-width: 32px;
            height: 32px;
            cursor: pointer;
        }

        .editor-btn:hover {
            background-color: #e5e7eb;
        }

        .editor-select {
            height: 32px;
            padding: 4px 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background-color: #ffffff;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .editor-color-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            background: #fff;
            padding: 2px 6px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }

        .editor-color-wrapper input[type="color"] {
            border: none;
            width: 20px;
            height: 20px;
            padding: 0;
            background: none;
            cursor: pointer;
        }

        .divider {
            width: 1px;
            height: 20px;
            background-color: #d1d5db;
            margin: 0 4px;
        }

        /* 🏁 樸素方格表格樣式 */
        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--grid-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            text-align: left;
            min-width: 500px;
        }

        th, td {
            border: 1px solid var(--grid-color);
            padding: 10px 12px;
            min-width: 100px;
            font-size: 14px;
            position: relative;
            word-break: break-word;
            white-space: pre-wrap;
        }

        th {
            background-color: var(--header-bg);
            font-weight: 600;
        }

        /* 當前點選/選取的儲存格高亮 */
        th.selected-cell, td.selected-cell {
            outline: 2px solid var(--selected-border) !important;
            outline-offset: -2px;
            background-color: var(--selected-bg) !important;
        }

        /* 儲存格編輯狀態 */
        td[contenteditable="true"]:focus, th[contenteditable="true"]:focus {
            outline: 2px solid var(--selected-border);
            background-color: #ffffff;
        }

        tr:hover td {
            background-color: var(--hover-bg);
        }

        @media (max-width: 600px) {
            body { padding: 10px 8px; }
            .container { padding: 14px 10px; border-radius: 8px; }
            h2 { font-size: 16px; }
            .toolbar button { flex: 1 1 calc(50% - 6px); padding: 8px 6px; font-size: 12px; }
            .toolbar button.danger, .toolbar button.success { flex: 1 1 100%; margin-left: 0 !important; }
            .text-editor-toolbar { gap: 4px; padding: 6px; }
            .editor-btn { padding: 4px 8px; font-size: 12px; }
            th, td { padding: 8px 10px; font-size: 13px; min-width: 90px; }
        }
    </style>
</head>
<body>

<!-- 🔒 登入視窗 -->
<div class="login-overlay" id="loginModal">
    <div class="login-card">
        <h3>請輸入密碼登入</h3>
        <input type="password" id="passwordInput" placeholder="請輸入密碼 (預設 admin)" onkeydown="if(event.key==='Enter') submitLogin()">
        <button onclick="submitLogin()">登入</button>
        <div class="error-msg" id="errorMsg">密碼錯誤，請重新輸入！</div>
    </div>
</div>

<!-- 📊 主系統介面 -->
<div class="container" id="mainContainer">
    <div class="header-row">
        <h2>JAF 記錄表 (雲端同步版)</h2>
        <button class="danger" onclick="logout()">登出</button>
    </div>

    <!-- 表格結構與匯出按鈕列 -->
    <div class="toolbar">
        <button onmousedown="event.preventDefault()" onclick="addRowBelowSelected()">+ 下方新增列</button>
        <button onmousedown="event.preventDefault()" onclick="removeSelectedRow()">- 刪除此橫列</button>
        <button onmousedown="event.preventDefault()" onclick="addColumnRightSelected()">+ 右側新增欄</button>
        <button onmousedown="event.preventDefault()" onclick="removeSelectedColumn()">- 刪除此直欄</button>
        <button class="success" onclick="exportToWord()" style="margin-left: auto;">📄 匯出 Word 檔</button>
        <button class="danger" onclick="clearData()">清空重設</button>
    </div>

    <!-- 📝 Word 風格文字編輯排版工具列 -->
    <div class="text-editor-toolbar">
        <select class="editor-select" id="fontSizeSelect" onchange="setFontSize(this.value); this.selectedIndex=0;" onmousedown="event.preventDefault()">
            <option value="" disabled selected>字型大小</option>
            <option value="12px">12 px</option>
            <option value="14px">14 px</option>
            <option value="16px">16 px</option>
            <option value="18px">18 px</option>
            <option value="20px">20 px</option>
            <option value="24px">24 px</option>
            <option value="28px">28 px</option>
        </select>

        <div class="divider"></div>

        <button class="editor-btn" title="粗體" onmousedown="event.preventDefault()" onclick="formatText('bold')"><b>B</b></button>
        <button class="editor-btn" title="斜體" onmousedown="event.preventDefault()" onclick="formatText('italic')"><i>I</i></button>
        <button class="editor-btn" title="底線" onmousedown="event.preventDefault()" onclick="formatText('underline')"><u>U</u></button>
        <button class="editor-btn" title="刪除線" onmousedown="event.preventDefault()" onclick="formatText('strikeThrough')"><s>S</s></button>

        <div class="divider"></div>

        <div class="editor-color-wrapper" title="文字顏色">
            <span><b>A</b></span>
            <input type="color" onmousedown="saveSelection()" onchange="formatText('foreColor', this.value)">
        </div>

        <div class="editor-color-wrapper" title="文字背景螢光色">
            <span>🖌️</span>
            <input type="color" value="#ffff00" onmousedown="saveSelection()" onchange="formatText('hiliteColor', this.value)">
        </div>

        <div class="divider"></div>

        <button class="editor-btn" title="靠左對齊" onmousedown="event.preventDefault()" onclick="formatText('justifyLeft')">⬅️</button>
        <button class="editor-btn" title="置中對齊" onmousedown="event.preventDefault()" onclick="formatText('justifyCenter')">↔️</button>
        <button class="editor-btn" title="靠右對齊" onmousedown="event.preventDefault()" onclick="formatText('justifyRight')">➡️</button>

        <div class="divider"></div>

        <button class="editor-btn" title="清除文字格式" onmousedown="event.preventDefault()" onclick="formatText('removeFormat')">🧹 清除格式</button>
    </div>

    <!-- 表格區域 -->
    <div class="table-container">
        <table id="gridTable">
            <thead>
                <tr id="tableHeader">
                    <th contenteditable="true">欄位 1</th>
                    <th contenteditable="true">欄位 2</th>
                    <th contenteditable="true">欄位 3</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td contenteditable="true">內容 A1</td>
                    <td contenteditable="true">內容 B1</td>
                    <td contenteditable="true">內容 C1</td>
                </tr>
                <tr>
                    <td contenteditable="true">內容 A2</td>
                    <td contenteditable="true">內容 B2</td>
                    <td contenteditable="true">內容 C2</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 引入 Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    // Firebase 專案設定
    const firebaseConfig = {
        apiKey: "AIzaSyAgeP2a6Z-TqJaZ5F0j_2UoXVQ_WE3sckw",
        authDomain: "jaffff-34d02.firebaseapp.com",
        databaseURL: "https://jaffff-34d02-default-rtdb.firebaseio.com",
        projectId: "jaffff-34d02",
        storageBucket: "jaffff-34d02.firebasestorage.app",
        messagingSenderId: "332430248808",
        appId: "1:332430248808:web:7d73ad95381dd1f3e664dd",
        measurementId: "G-LQYZZV98HC"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref('tableData');

    const table = document.getElementById("gridTable");
    const tableHeader = document.getElementById("tableHeader");
    const tableBody = document.getElementById("tableBody");
    const mainContainer = document.getElementById("mainContainer");
    const loginModal = document.getElementById("loginModal");
    const passwordInput = document.getElementById("passwordInput");
    const errorMsg = document.getElementById("errorMsg");

    const ADMIN_PASSWORD = "admin";
    let selectedCell = null;
    let isUpdatingFromCloud = false;
    let isComposing = false;
    let savedRange = null;

    const defaultData = {
        headers: ["欄位 1", "欄位 2", "欄位 3"],
        rows: [
            ["內容 A1", "內容 B1", "內容 C1"],
            ["內容 A2", "內容 B2", "內容 C2"]
        ]
    };

    document.addEventListener("DOMContentLoaded", function() {
        const isAuth = sessionStorage.getItem("isAdminAuth");
        if (isAuth === "true") {
            showApp();
        } else {
            loginModal.style.display = "flex";
            passwordInput.focus();
        }

        document.addEventListener('selectionchange', saveSelection);
    });

    function saveSelection() {
        const sel = window.getSelection();
        if (sel.rangeCount > 0) {
            const range = sel.getRangeAt(0);
            if (table.contains(range.commonAncestorContainer)) {
                savedRange = range.cloneRange();
            }
        }
    }

    function restoreSelection() {
        if (savedRange) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
        }
    }

    function submitLogin() {
        const inputVal = passwordInput.value;
        if (inputVal === ADMIN_PASSWORD) {
            sessionStorage.setItem("isAdminAuth", "true");
            errorMsg.style.display = "none";
            showApp();
        } else {
            errorMsg.style.display = "block";
            passwordInput.value = "";
            passwordInput.focus();
        }
    }

    function logout() {
        if (confirm("確定要登出系統嗎？")) {
            sessionStorage.removeItem("isAdminAuth");
            location.reload();
        }
    }

    function formatText(command, value = null) {
        restoreSelection();
        document.execCommand('styleWithCSS', false, true);
        document.execCommand(command, false, value);
        saveTableDataToCloud();
    }

    function setFontSize(pxSize) {
        restoreSelection();
        const sel = window.getSelection();
        if (!sel.isCollapsed && savedRange) {
            const span = document.createElement('span');
            span.style.fontSize = pxSize;
            try {
                savedRange.surroundContents(span);
            } catch(e) {
                document.execCommand('fontSize', false, '3');
            }
            saveTableDataToCloud();
        }
    }

    /* 📄 精準美化 Word 導出模組 */
    function exportToWord() {
        const tableClone = table.cloneNode(true);

        // 移除選取框與 contenteditable 屬性
        tableClone.querySelectorAll('th, td').forEach(cell => {
            cell.classList.remove('selected-cell');
            cell.removeAttribute('contenteditable');
            
            // 轉換內嵌樣式以精準相容 Word
            cell.style.border = '1.0pt solid #d1d5db';
            cell.style.padding = '8px 12px';
            cell.style.fontSize = '14px';
            cell.style.wordBreak = 'break-word';
            cell.style.whiteSpace = 'pre-wrap';
        });

        tableClone.querySelectorAll('th').forEach(th => {
            th.style.backgroundColor = '#f3f4f6';
            th.style.fontWeight = 'bold';
        });

        const wordHTML = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' 
                  xmlns:w='urn:schemas-microsoft-com:office:word' 
                  xmlns='http://www.w3.org/TR/REC-html40'>
            <head>
                <meta charset='utf-8'>
                <title>JAF 記錄表</title>
                <!--[if gte mso 9]>
                <xml>
                    <w:WordDocument>
                        <w:View>Print</w:View>
                        <w:Zoom>100</w:Zoom>
                        <w:DoNotOptimizeForBrowser/>
                    </w:WordDocument>
                </xml>
                <![endif]-->
                <style>
                    @page {
                        size: A4 portrait;
                        margin: 2cm;
                    }
                    body {
                        font-family: 'Microsoft JhengHei', 'Segoe UI', Arial, sans-serif;
                        color: #374151;
                    }
                    h2 {
                        font-size: 18pt;
                        margin-bottom: 12pt;
                        color: #111827;
                    }
                    table {
                        border-collapse: collapse;
                        width: 100%;
                        margin-top: 10px;
                        mso-yfti-tbllook: 1188;
                        mso-padding-alt: 0cm 5.4pt 0cm 5.4pt;
                    }
                    tr {
                        mso-yfti-irow: 0;
                        mso-yfti-firstrow: yes;
                    }
                    th, td {
                        mso-border-alt: solid #d1d5db .5pt;
                    }
                </style>
            </head>
            <body>
                <h2>JAF 記錄表</h2>
                ${tableClone.outerHTML}
            </body>
            </html>
        `;

        const blob = new Blob(['\ufeff' + wordHTML], { type: 'application/msword;charset=utf-8' });
        const today = new Date().toISOString().split('T')[0];
        const fileName = `JAF_記錄表_${today}.doc`;

        if (navigator.msSaveOrOpenBlob) {
            navigator.msSaveOrOpenBlob(blob, fileName);
        } else {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }

    function showApp() {
        loginModal.style.display = "none";
        mainContainer.style.display = "block";

        dbRef.on('value', function(snapshot) {
            const data = snapshot.val();
            if (data) {
                if (document.activeElement && document.activeElement.isContentEditable) {
                    return;
                }
                isUpdatingFromCloud = true;
                renderTableData(data);
                bindCellEvents();
                isUpdatingFromCloud = false;
            } else {
                dbRef.set(defaultData);
            }
        });

        table.addEventListener("compositionstart", function() { isComposing = true; });
        table.addEventListener("compositionend", function() { isComposing = false; saveTableDataToCloud(); });
        table.addEventListener("input", function() {
            if (!isUpdatingFromCloud && !isComposing) {
                saveTableDataToCloud();
            }
        });
    }

    function bindCellEvents() {
        table.querySelectorAll("th, td").forEach(function(cell) {
            cell.removeEventListener("focus", handleCellFocus);
            cell.removeEventListener("mousedown", handleCellFocus);
            cell.removeEventListener("blur", saveTableDataToCloud);
            
            cell.addEventListener("focus", handleCellFocus);
            cell.addEventListener("mousedown", handleCellFocus);
            cell.addEventListener("blur", saveTableDataToCloud);
        });
    }

    function handleCellFocus(e) {
        if (selectedCell) {
            selectedCell.classList.remove("selected-cell");
        }
        selectedCell = e.currentTarget;
        selectedCell.classList.add("selected-cell");
    }

    function getSelectedPosition() {
        if (!selectedCell) return null;
        const cell = selectedCell;
        const colIndex = cell.cellIndex;
        const row = cell.parentElement;
        return { row, cell, colIndex };
    }

    function addRowBelowSelected() {
        const pos = getSelectedPosition();
        const colCount = tableHeader.cells.length;
        const newRow = document.createElement("tr");

        for (let i = 0; i < colCount; i++) {
            const newCell = document.createElement("td");
            newCell.contentEditable = "true";
            newCell.innerHTML = "";
            newRow.appendChild(newCell);
        }

        if (pos && pos.row.parentElement.tagName === "TBODY") {
            pos.row.after(newRow);
        } else {
            tableBody.appendChild(newRow);
        }

        bindCellEvents();
        saveTableDataToCloud();
    }

    function removeSelectedRow() {
        const pos = getSelectedPosition();
        if (!pos) {
            if (tableBody.rows.length > 1) {
                tableBody.deleteRow(-1);
                saveTableDataToCloud();
            } else { alert("至少需保留一列資料！"); }
            return;
        }
        if (pos.row.parentElement.tagName === "THEAD") { alert("不能刪除標題表頭列！"); return; }
        if (tableBody.rows.length <= 1) { alert("至少需保留一列資料！"); return; }

        pos.row.remove();
        selectedCell = null;
        bindCellEvents();
        saveTableDataToCloud();
    }

    function addColumnRightSelected() {
        const pos = getSelectedPosition();
        const colIndex = pos ? pos.colIndex : tableHeader.cells.length - 1;

        const ths = Array.from(tableHeader.cells);
        const newTh = document.createElement("th");
        newTh.contentEditable = "true";
        newTh.innerHTML = "欄位 " + (ths.length + 1);
        ths[colIndex].after(newTh);

        Array.from(tableBody.rows).forEach(function(row) {
            const tds = Array.from(row.cells);
            const newTd = document.createElement("td");
            newTd.contentEditable = "true";
            newTd.innerHTML = "";
            if (tds[colIndex]) { tds[colIndex].after(newTd); } 
            else { row.appendChild(newTd); }
        });

        bindCellEvents();
        saveTableDataToCloud();
    }

    function removeSelectedColumn() {
        if (tableHeader.cells.length <= 1) { alert("至少需保留一欄！"); return; }
        const pos = getSelectedPosition();
        const targetColIndex = pos ? pos.colIndex : tableHeader.cells.length - 1;

        tableHeader.deleteCell(targetColIndex);

        Array.from(tableBody.rows).forEach(function(row) {
            if (row.cells[targetColIndex]) { row.deleteCell(targetColIndex); }
        });

        selectedCell = null;
        bindCellEvents();
        saveTableDataToCloud();
    }

    function saveTableDataToCloud() {
        const headers = Array.from(tableHeader.cells).map(function(cell) { return cell.innerHTML; });
        const rows = Array.from(tableBody.rows).map(function(row) { 
            return Array.from(row.cells).map(function(cell) { return cell.innerHTML; });
        });

        const tableData = { headers: headers, rows: rows };
        dbRef.set(tableData);
    }

    function renderTableData(data) {
        if (!data || !data.headers || !data.rows) return;

        const headers = data.headers;
        const rows = data.rows;

        tableHeader.innerHTML = "";
        headers.forEach(function(text) {
            const th = document.createElement("th");
            th.contentEditable = "true";
            th.innerHTML = text;
            tableHeader.appendChild(th);
        });

        tableBody.innerHTML = "";
        rows.forEach(function(rowData) {
            const tr = document.createElement("tr");
            rowData.forEach(function(text) {
                const td = document.createElement("td");
                td.contentEditable = "true";
                td.innerHTML = text;
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });
    }

    function clearData() {
        if (confirm("確定要清空並重設雲端表格嗎？")) {
            dbRef.set(defaultData);
        }
    }
</script>

</body>
</html>
